<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>বাংলা কিডস কুইজ 🎈</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700;800&display=swap');

*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; overflow:hidden;
  font-family:'Noto Sans Bengali',sans-serif;
  background:linear-gradient(135deg,#ffd6ec,#c9f4ff,#fff0b8,#d8ccff);
  background-size:400% 400%;
  animation:bg 12s ease infinite;
  display:flex; justify-content:center; align-items:center;
  color:#34204f;
}
@keyframes bg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

.bubble{position:fixed;border-radius:50%;filter:blur(1px);opacity:.35;animation:float 7s ease-in-out infinite}
.b1{width:140px;height:140px;background:#ff7eb6;top:5%;left:4%}
.b2{width:180px;height:180px;background:#6edcff;bottom:-30px;right:4%;animation-delay:1s}
.b3{width:90px;height:90px;background:#ffd45c;top:20%;right:8%;animation-delay:2s}
@keyframes float{50%{transform:translateY(-25px) scale(1.08)}}

.card{
  width:min(92vw,720px); min-height:510px; position:relative; z-index:2;
  background:rgba(255,255,255,.88); backdrop-filter:blur(16px);
  border:3px solid rgba(255,255,255,.8);
  border-radius:32px; padding:38px 34px;
  box-shadow:0 25px 70px rgba(82,43,117,.22);
  text-align:center;
}
h1{font-size:clamp(34px,7vw,62px);margin:5px 0 10px;font-weight:800}
.subtitle{font-size:20px;margin:0 auto 30px;line-height:1.7}
.sparkle{font-size:45px;animation:bounce 1.5s infinite}
@keyframes bounce{50%{transform:translateY(-9px) rotate(5deg)}}

button{
  border:0; border-radius:18px; padding:15px 28px;
  font:700 18px 'Noto Sans Bengali',sans-serif; cursor:pointer;
  background:linear-gradient(135deg,#ff5fa2,#8b6cff);
  color:white; box-shadow:0 9px 20px rgba(123,79,210,.25);
  transition:.2s;
}
button:hover{transform:translateY(-3px) scale(1.02)}
button:active{transform:scale(.98)}
.hidden{display:none!important}

.progress{font-weight:700;color:#8b6cff;margin-bottom:16px;font-size:16px}
.question{
  font-size:clamp(23px,4vw,32px);font-weight:800;line-height:1.5;
  margin:20px 0 25px;
}
input{
  width:100%;padding:17px 18px;border:3px solid #eadcf8;
  border-radius:17px;font:500 17px 'Noto Sans Bengali',sans-serif;
  outline:none;background:#fff;
}
input:focus{border-color:#9b7cff;box-shadow:0 0 0 4px rgba(155,124,255,.12)}
.answer{
  margin:23px 0 20px;padding:18px;border-radius:20px;
  background:linear-gradient(135deg,#fff4a8,#d9ffd9);
  font-size:22px;font-weight:800;animation:pop .45s ease;
}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}

.nav{margin-top:18px}
.hint{font-size:14px;color:#826e92;margin-top:12px}

.balloon{
  position:fixed;top:-100px;width:28px;height:36px;border-radius:50%;
  z-index:10;animation:fall linear forwards;
}
.balloon:after{
  content:"";position:absolute;left:50%;top:34px;width:1px;height:45px;
  background:rgba(50,50,50,.3);
}
@keyframes fall{
  0%{transform:translateY(-30px) rotate(0deg);opacity:1}
  100%{transform:translateY(115vh) rotate(360deg);opacity:.95}
}
.confetti{
  position:fixed;top:-15px;width:9px;height:18px;z-index:9;
  animation:confetti 2.7s linear forwards;
}
@keyframes confetti{
  to{transform:translateY(110vh) rotate(720deg);opacity:0}
}
.final h2{font-size:42px;margin:12px 0}
.final p{font-size:21px;line-height:1.7}
</style>
</head>
<body>
<div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>

<div class="card">
  <section id="start">
    <div class="sparkle">🎈 ✨ 🎉</div>
    <h1>বাংলা কিডস কুইজ!</h1>
    <p class="subtitle">মজার মজার প্রশ্নের উত্তর দাও<br>আর প্রতিটি উত্তর দেখার সময় উপভোগ করো! 🌈</p>
    <button onclick="startQuiz()">🚀 কুইজ শুরু করো!</button>
  </section>

  <section id="quiz" class="hidden">
    <div class="progress" id="progress"></div>
    <div class="question" id="question"></div>
    <input id="userAnswer" type="text" placeholder="তোমার উত্তর এখানে লেখো...">
    <div class="nav">
      <button id="showBtn" onclick="showAnswer()">🎈 উত্তর দেখাও</button>
      <button id="nextBtn" class="hidden" onclick="nextQuestion()">পরের প্রশ্ন ➜</button>
    </div>
    <div id="answer" class="answer hidden"></div>
    <div class="hint">💡 এখানে কোনো নম্বর বা স্কোর নেই — শুধু মজা!</div>
  </section>

  <section id="final" class="final hidden">
    <div class="sparkle">🎉 🎈 🌈 🎈 🎉</div>
    <h2>কুইজ শেষ! 🥳</h2>
    <p>দারুণ খেলেছো!<br>তুমি পুরো কুইজটি শেষ করে ফেলেছো। 💖</p>
    <button onclick="restart()">🔄 আবার খেলো</button>
  </section>
</div>

<script>
const quiz = [
 ["ভারতের জাতীয় প্রতীক কী?","অশোক স্তম্ভ"],
 ["তাজমহর কোন শহরে অবস্থিত?","আগ্রা"],
 ["ভারতের সবচেয়ে বড় মরুভূমির নাম কী?","থর মরুভূমি"],
 ["কোন প্রাণীকে ‘জঙ্গলের রাজা’ বলা হয়?","সিংহ"],
 ["আমাদের শরীরে রক্ত পাম্প করে কোন অঙ্গ?","হৃদপিণ্ড"],
 ["লালকেল্লা কোন শহরে অবস্থিত?","দিল্লি"],
 ["ভারতের প্রথম প্রধানমন্ত্রী কে ছিলেন?","জওহরলাল নেহরু"],
 ["ভারত কোন মহাদেশে অবস্থিত?","এশিয়া"],
 ["গঙ্গা নদী কোন দেশের মধ্য দিয়ে প্রবাহিত হয়?","ভারত"],
 ["পশ্চিমবঙ্গের বিখ্যাত মিষ্টির নাম কী?","রসগোল্লা"],
 ["দুর্গাপূজা কোন দেবীর পূজা?","দেবী দুর্গা"],
 ["দীপাবলিকে আর কী নামে বলা হয়?","আলোর উৎসব"],
 ["ভারতের কোন রাজ্যকে ‘চা-বাগানের রাজ্য’ বলা হয়?","অসম"],
 ["ভারতের জাতীয় পতাকার মাঝখানে কোন চিহ্ন আছে?","অশোকচক্র"],
 ["সুন্দরবন কোন প্রাণীর জন্য বিখ্যাত?","রয়্যাল বেঙ্গল টাইগার"],
 ["আকাশের কোন গ্রহকে ‘লাল গ্রহ’ বলা হয়?","মঙ্গল গ্রহ"],
 ["গাছপালা বাতাস থেকে কোন গ্যাস গ্রহণ করে?","কার্বন ডাই-অক্সাইড"],
 ["এক ডজন মানে কতটি?","১২টি"],
 ["ভারতের কোন শহরকে ‘গোলাপি শহর’ বলা হয়?","জয়পুর"],
 ["রামধনুতে সাধারণত কয়টি রং দেখা যায়?","৭টি"]
];

let current=0;

function startQuiz(){
  document.getElementById('start').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  current=0; renderQuestion();
  celebrate(12);
}
function renderQuestion(){
  const [q]=quiz[current];
  document.getElementById('progress').textContent=`প্রশ্ন ${current+1} / ${quiz.length}`;
  document.getElementById('question').textContent=q;
  const input=document.getElementById('userAnswer');
  input.value=''; input.focus();
  document.getElementById('answer').classList.add('hidden');
  document.getElementById('showBtn').classList.remove('hidden');
  document.getElementById('nextBtn').classList.add('hidden');
}
function showAnswer(){
  document.getElementById('answer').textContent="সঠিক উত্তর: "+quiz[current][1]+" 🎉";
  document.getElementById('answer').classList.remove('hidden');
  document.getElementById('showBtn').classList.add('hidden');
  document.getElementById('nextBtn').classList.remove('hidden');
  document.getElementById('userAnswer').blur();
  celebrate(18);
}
function nextQuestion(){
  current++;
  if(current>=quiz.length){
    document.getElementById('quiz').classList.add('hidden');
    document.getElementById('final').classList.remove('hidden');
    celebrate(35);
  } else renderQuestion();
}
function restart(){
  document.getElementById('final').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  current=0; renderQuestion(); celebrate(15);
}
function celebrate(n){
  const balloonColors=['#ff5fa2','#6edcff','#ffd45c','#8b6cff','#72df8c','#ff8d6b'];
  for(let i=0;i<n;i++){
    setTimeout(()=>{
      const b=document.createElement('div');
      b.className='balloon';
      b.style.left=Math.random()*100+'vw';
      b.style.animationDuration=(2.8+Math.random()*2.7)+'s';
      b.style.background=balloonColors[Math.floor(Math.random()*balloonColors.length)];
      b.style.transform=`rotate(${Math.random()*30-15}deg)`;
      document.body.appendChild(b);
      setTimeout(()=>b.remove(),6000);
    },i*45);
  }
  for(let i=0;i<Math.min(n,25);i++){
    setTimeout(()=>{
      const c=document.createElement('div'); c.className='confetti';
      c.style.left=Math.random()*100+'vw';
      c.style.background=balloonColors[Math.floor(Math.random()*balloonColors.length)];
      c.style.animationDuration=(1.7+Math.random()*1.5)+'s';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),3500);
    },i*30);
  }
}
</script>
</body>
</html>
